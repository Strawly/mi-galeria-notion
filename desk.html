<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Escritorio Y2K Soft Aesthetic - Notion</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        /* VARIABLES DE TEMA DINÁMICAS (AJUSTE Y2K COMPLETO) */
        :root {
            --theme-accent: #f472b6;
            --theme-accent-hover: #ec4899;
            --theme-header-bg: linear-gradient(180deg, #fce0e6 0%, #f7d2db 60%, #ffffff 100%);
            --theme-window-bg: rgba(255, 255, 255, 0.95);
            --theme-toolbar-bg: rgba(255, 255, 255, 0.85);
            --theme-footer-bg: rgba(252, 231, 243, 0.5);
            --theme-dock-bg: rgba(255, 255, 255, 0.75);
            --theme-border: #e8d0d8;
            --theme-text: #5a4b51;
            --theme-title: #ec4899;
            --theme-editor-bg: rgba(255, 255, 255, 0.85);
            --theme-editor-text: #4a3b42;
            --theme-btn-bg: #ffffff;
            --theme-btn-text: #5a4b51;
            --theme-btn-hover-bg: #fff8f9;
            --theme-desktop-label: #ffffff;
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            touch-action: none;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: #fce7f3;
            color: var(--theme-text);
        }

        /* FONDO DE PANTALLA */
        #wallpaper-bg {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.4s ease-in-out;
            width: 100vw;
            height: 100vh;
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ESTILO Y2K PARA VENTANAS */
        .y2k-window {
            background: var(--theme-window-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--theme-border);
            box-shadow: 
                0 20px 40px -10px rgba(0, 0, 0, 0.15),
                0 10px 20px -5px rgba(0, 0, 0, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            overflow: hidden;
            resize: both;
            min-width: 320px;
            min-height: 280px;
            max-width: 95vw;
            max-height: 90vh;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
            display: flex;
            flex-direction: column;
            color: var(--theme-text);
        }

        /* BARRA SUPERIOR Y ESTRUCTURA FIJA DE LA VENTANA */
        .y2k-header {
            background: var(--theme-header-bg);
            border-bottom: 1px solid var(--theme-border);
            flex-shrink: 0;
            user-select: none;
            color: var(--theme-text);
        }

        .y2k-toolbar {
            background: var(--theme-toolbar-bg);
            border-bottom: 1px solid var(--theme-border);
            flex-shrink: 0;
            user-select: none;
        }

        .y2k-footer {
            background: var(--theme-footer-bg);
            border-top: 1px solid var(--theme-border);
            flex-shrink: 0;
            user-select: none;
            color: var(--theme-text);
        }

        /* BOTONES BLANCOS REDONDEADOS TIPO PILL */
        .y2k-btn-pill {
            background: var(--theme-btn-bg);
            border: 1px solid var(--theme-border);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            color: var(--theme-btn-text);
            font-size: 11px;
            font-weight: 600;
            transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .y2k-btn-pill:hover {
            transform: translateY(-1.5px) scale(1.03);
            background: var(--theme-btn-hover-bg);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
            border-color: var(--theme-accent);
            color: var(--theme-accent-hover);
        }

        .y2k-btn-pill.active {
            background: var(--theme-accent);
            color: #ffffff !important;
            border-color: var(--theme-accent-hover);
        }

        /* BOTONES DE ACCIÓN (CABECERA) */
        .y2k-action-btn {
            width: 26px;
            height: 26px;
            border-radius: 9px;
            background: var(--theme-btn-bg);
            border: 1px solid var(--theme-border);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            color: var(--theme-btn-text);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .y2k-action-btn:hover {
            transform: scale(1.12);
            background: var(--theme-btn-hover-bg);
            color: var(--theme-accent-hover);
            border-color: var(--theme-accent);
        }

        /* DOCK INFERIOR PASTEL LIQUID GLASS */
        .liquid-glass-dock {
            background: var(--theme-dock-bg);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1.5px solid var(--theme-border);
            box-shadow: 
                0 16px 32px rgba(0, 0, 0, 0.15),
                inset 0 1px 2px rgba(255, 255, 255, 0.6);
            border-radius: 24px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .dock-btn {
            position: relative;
            background: var(--theme-btn-bg);
            border: 1px solid var(--theme-border);
            color: var(--theme-btn-text);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, color 0.2s ease;
        }

        .dock-btn:hover {
            transform: translateY(-6px) scale(1.15);
            background: var(--theme-btn-hover-bg);
            color: var(--theme-accent-hover);
            border-color: var(--theme-accent);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .dock-btn.active-win {
            border-color: var(--theme-accent);
            background: var(--theme-btn-hover-bg);
            color: var(--theme-accent-hover);
        }

        .dock-dot {
            width: 5px;
            height: 5px;
            background-color: var(--theme-accent);
            border-radius: 50%;
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 6px var(--theme-accent);
        }

        .dock-btn .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            transition: all 0.2s ease;
            white-space: nowrap;
            pointer-events: none;
            background: var(--theme-window-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            color: var(--theme-text);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .dock-btn:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ÍCONOS DEL ESCRITORIO */
        .desktop-item {
            position: absolute;
            transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            cursor: grab;
            outline: none;
            z-index: 10;
        }

        .desktop-item:active {
            cursor: grabbing;
        }

        .desktop-item.dragging {
            transition: none !important;
            z-index: 1000 !important;
            opacity: 0.9;
            transform: scale(1.1);
        }

        .desktop-item:hover .icon-wrapper {
            transform: translateY(-4px) scale(1.12);
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.22));
        }

        .icon-wrapper {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
        }

        .desktop-label {
            font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.2px;
            color: var(--theme-desktop-label);
            text-shadow: 
                0 1px 3px rgba(0, 0, 0, 0.8),
                0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* EDITOR RICO CON INSERCIÓN ESTILO WORD */
        .rich-note-editor {
            user-select: text;
            -webkit-user-select: text;
            outline: none;
            min-height: 100%;
            background: var(--theme-editor-bg);
            color: var(--theme-editor-text);
            line-height: 1.6;
        }

        .rich-note-editor:empty:before {
            content: attr(data-placeholder);
            color: #a09098;
            pointer-events: none;
            display: block;
        }

        .rich-note-editor ul {
            list-style-type: disc;
            padding-left: 1.25rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .rich-note-editor ol {
            list-style-type: decimal;
            padding-left: 1.25rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .rich-note-editor b, .rich-note-editor strong {
            font-weight: 700;
        }

        /* IMÁGENES INLINE CON TEXTO AL LADO */
        .rich-note-editor .inline-img-wrapper {
            position: relative;
            display: inline-block;
            margin: 6px;
            vertical-align: middle;
            user-select: none;
            max-width: 100%;
        }

        .rich-note-editor .inline-img-wrapper img {
            border-radius: 16px;
            border: 2px solid var(--theme-border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transition: all 0.2s ease;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .rich-note-editor .inline-img-wrapper:hover img,
        .rich-note-editor .inline-img-wrapper.selected img {
            border-color: var(--theme-accent);
            box-shadow: 0 0 0 3px var(--theme-accent), 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        /* BARRA FLOTANTE DE ALINEACIÓN DE IMAGEN */
        .img-toolbar {
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--theme-window-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            padding: 3px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .inline-img-wrapper:hover .img-toolbar,
        .inline-img-wrapper.selected .img-toolbar {
            opacity: 1;
            pointer-events: auto;
        }

        .img-toolbar button {
            background: var(--theme-btn-bg);
            border: 1px solid var(--theme-border);
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 10px;
            font-weight: 600;
            color: var(--theme-btn-text);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-toolbar button:hover {
            background: var(--theme-btn-hover-bg);
            color: var(--theme-accent-hover);
            border-color: var(--theme-accent);
        }

        .inline-img-wrapper.align-left {
            float: left;
            margin: 6px 14px 6px 0;
        }

        .inline-img-wrapper.align-center {
            display: block;
            margin: 10px auto;
            text-align: center;
            float: none;
        }

        .inline-img-wrapper.align-right {
            float: right;
            margin: 6px 0 6px 14px;
        }

        .inline-img-wrapper.align-full {
            display: block;
            width: 100%;
            margin: 10px 0;
            float: none;
        }

        .inline-img-wrapper.align-full img {
            width: 100% !important;
        }

        .rich-note-editor::after {
            content: "";
            display: table;
            clear: both;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--theme-accent);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--theme-accent-hover);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden relative">

    <!-- FONDO DE PANTALLA -->
    <div id="wallpaper-bg"></div>

    <!-- OVERLAY ARRASTRAR ARCHIVO DE FONDO -->
    <div id="drop-overlay" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/60 backdrop-blur-md text-white pointer-events-none transition-all">
        <i data-lucide="image-plus" class="w-16 h-16 mb-3 animate-bounce text-pink-200"></i>
        <p class="text-base font-bold tracking-wide font-['Fredoka']">Suelta aquí tu nueva imagen de fondo 🌸</p>
        <p class="text-xs text-pink-100/80 mt-1">Soporta JPG, PNG, WEBP y GIF</p>
    </div>

    <!-- ÁREA DEL ESCRITORIO (ÍCONOS) -->
    <main id="desktop-area" class="w-full h-full pb-28 relative overflow-hidden z-10"></main>

    <!-- CONTENEDOR MULTI-VENTANAS PARALELAS -->
    <div id="windows-container" class="fixed inset-0 z-30 pointer-events-none"></div>

    <!-- DOCK INFERIOR (BARRA DE TAREAS LIQUID GLASS) -->
    <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40">
        <div class="liquid-glass-dock px-4 py-2.5 flex items-center gap-2.5 max-w-[95vw] overflow-x-auto no-scrollbar">
            
            <button onclick="openNewModal()" class="dock-btn p-2.5 rounded-2xl shrink-0">
                <i data-lucide="plus" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Añadir Nota / Ícono</span>
            </button>

            <button onclick="toggleThemeMenu()" class="dock-btn p-2.5 rounded-2xl shrink-0">
                <i data-lucide="image" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Cambiar Fondo</span>
            </button>

            <button onclick="toggleColorSettingsModal()" class="dock-btn p-2.5 rounded-2xl shrink-0">
                <i data-lucide="palette" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Personalizar Tema</span>
            </button>

            <div class="h-6 w-[1.5px] opacity-40 bg-slate-400 my-auto mx-0.5 shrink-0"></div>

            <div id="dock-dynamic-apps" class="flex items-center gap-2 shrink-0"></div>

            <div class="h-6 w-[1.5px] opacity-40 bg-slate-400 my-auto mx-0.5 shrink-0"></div>

            <button onclick="shuffleItems()" class="dock-btn p-2.5 rounded-2xl shrink-0">
                <i data-lucide="shuffle" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Aleatorizar Íconos</span>
            </button>

            <button onclick="resetDesktop()" class="dock-btn p-2.5 rounded-2xl !text-rose-500 hover:!bg-rose-50 shrink-0">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Restablecer Todo</span>
            </button>

        </div>
    </nav>

    <!-- MENU POPUP DE CAMBIO DE FONDO DE PANTALLA -->
    <div id="wallpaper-menu" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 y2k-window p-5 w-84 sm:w-96 shadow-2xl space-y-4 hidden">
        <div class="flex justify-between items-center pb-2 border-b border-inherit">
            <h3 class="text-xs font-bold uppercase tracking-wider flex items-center gap-2 font-['Fredoka']">
                <i data-lucide="sparkles" class="w-4 h-4"></i> Fondo de Pantalla
            </h3>
            <button onclick="toggleThemeMenu()" class="y2k-action-btn"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>

        <div class="space-y-1.5">
            <label class="block text-[11px] font-semibold opacity-80">Pegar URL de Imagen</label>
            <div class="flex gap-2">
                <input type="url" id="wallpaper-url-input" placeholder="https://ejemplo.com/fondo.jpg" class="flex-1 bg-white/50 border border-inherit rounded-xl px-3 py-1.5 text-xs focus:outline-none">
                <button onclick="setWallpaperFromInput()" class="y2k-btn-pill px-3.5 py-1.5 active">Aplicar</button>
            </div>
        </div>

        <div class="space-y-1.5">
            <label class="block text-[11px] font-semibold opacity-80">Subir Imagen Local</label>
            <label class="flex items-center justify-center gap-2 w-full p-2.5 bg-white/40 hover:bg-white/60 border border-dashed border-inherit rounded-xl cursor-pointer transition text-xs font-medium">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                <span>Seleccionar archivo desde el equipo</span>
                <input type="file" id="wallpaper-file-input" accept="image/*" class="hidden" onchange="handleWallpaperUpload(event)">
            </label>
        </div>

        <div class="space-y-1.5">
            <label class="block text-[11px] font-semibold opacity-80">Presets Pastel & Y2K</label>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setWallpaper('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1200')" class="h-12 rounded-xl bg-cover bg-center border border-white/50 hover:scale-105 transition shadow-sm text-[10px] font-bold text-slate-800 flex items-end p-1.5" style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=300')"><span class="bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">Pastel Gradient</span></button>
                <button onclick="setWallpaper('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200')" class="h-12 rounded-xl bg-cover bg-center border border-white/50 hover:scale-105 transition shadow-sm text-[10px] font-bold text-slate-800 flex items-end p-1.5" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=300')"><span class="bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">Soft Waves</span></button>
                <button onclick="setWallpaper('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200')" class="h-12 rounded-xl bg-cover bg-center border border-white/50 hover:scale-105 transition shadow-sm text-[10px] font-bold text-slate-800 flex items-end p-1.5" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=300')"><span class="bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">Playa Soft</span></button>
                <button onclick="setWallpaper('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200')" class="h-12 rounded-xl bg-cover bg-center border border-white/50 hover:scale-105 transition shadow-sm text-[10px] font-bold text-slate-800 flex items-end p-1.5" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=300')"><span class="bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">Stars Dark</span></button>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIGURACIÓN DE LAS 6 PALETAS Y2K PREDEFINIDAS -->
    <div id="color-settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
        <div class="y2k-window w-full max-w-sm p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-inherit pb-2">
                <h3 class="font-bold text-xs font-['Fredoka'] flex items-center gap-1.5">
                    <i data-lucide="palette" class="w-4 h-4"></i> Las 6 Paletas Predefinidas Y2K
                </h3>
                <button onclick="toggleColorSettingsModal()" class="y2k-action-btn"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            </div>

            <div class="space-y-3">
                <label class="block text-[11px] font-semibold opacity-80">Selecciona un estilo cromático:</label>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="applyPresetTheme('pink')" class="y2k-btn-pill py-2.5 px-3 flex items-center gap-2.5 justify-start">
                        <span class="w-4 h-4 rounded-full bg-pink-400 border border-pink-200 shrink-0"></span>
                        <span class="text-xs">🌸 Soft Pink / Coquette</span>
                    </button>
                    <button onclick="applyPresetTheme('lavender')" class="y2k-btn-pill py-2.5 px-3 flex items-center gap-2.5 justify-start">
                        <span class="w-4 h-4 rounded-full bg-purple-400 border border-purple-200 shrink-0"></span>
                        <span class="text-xs">🍇 Y2K Lavender</span>
                    </button>
                    <button onclick="applyPresetTheme('cyan')" class="y2k-btn-pill py-2.5 px-3 flex items-center gap-2.5 justify-start">
                        <span class="w-4 h-4 rounded-full bg-cyan-400 border border-cyan-200 shrink-0"></span>
                        <span class="text-xs">💎 Cyber Cyan</span>
                    </button>
                    <button onclick="applyPresetTheme('matcha')" class="y2k-btn-pill py-2.5 px-3 flex items-center gap-2.5 justify-start">
                        <span class="w-4 h-4 rounded-full bg-emerald-400 border border-emerald-200 shrink-0"></span>
                        <span class="text-xs">🍵 Matcha Green</span>
                    </button>
                    <button onclick="applyPresetTheme('peach')" class="y2k-btn-pill py-2.5 px-3 flex items-center gap-2.5 justify-start">
                        <span class="w-4 h-4 rounded-full bg-orange-300 border border-orange-200 shrink-0"></span>
                        <span class="text-xs">🍑 Warm Peach</span>
                    </button>
                    <button onclick="applyPresetTheme('dark')" class="y2k-btn-pill py-2.5 px-3 flex items-center gap-2.5 justify-start">

        let desktopItems = [];

        window.onload = function () {

        function loadSavedState() {
            try {
                const savedItems = localStorage.getItem('y2k_notion_items');
                const savedBg = localStorage.getItem('y2k_notion_bg');
                const savedThemeKey = localStorage.getItem('y2k_notion_theme_key');

                if (savedItems) {
                    desktopItems = JSON.parse(savedItems);
                } else {
                    desktopItems = JSON.parse(JSON.stringify(defaultItems));
                }

                if (savedBg) {
                    currentWallpaper = savedBg;
                } else {
                    currentWallpaper = defaultWallpaper;
                }

                if (savedThemeKey && presetThemes[savedThemeKey]) {
                    applyPresetTheme(savedThemeKey);
                } else {
                    applyPresetTheme('pink');
                }

                applyWallpaperStyle(currentWallpaper);

                desktopItems.forEach((item, index) => {
                    if (item.x === undefined || item.y === undefined) {
                        const pos = getRandomPosition(index);
                        item.x = pos.x;
                        item.y = pos.y;
                    }
                });
            } catch (e) {
                console.warn('Error al cargar LocalStorage:', e);
                desktopItems = JSON.parse(JSON.stringify(defaultItems));
            }
        }

        function saveState() {
            try {
                localStorage.setItem('y2k_notion_items', JSON.stringify(desktopItems));
                localStorage.setItem('y2k_notion_bg', currentWallpaper);
            } catch (e) {
                console.warn('Error al guardar en LocalStorage');
            }
        }

        function applyPresetTheme(key) {
            const theme = presetThemes[key] || presetThemes.pink;

            document.documentElement.style.setProperty('--theme-accent', theme.accent);
            document.documentElement.style.setProperty('--theme-accent-hover', theme.accentHover);
            document.documentElement.style.setProperty('--theme-border', theme.border);
            document.documentElement.style.setProperty('--theme-header-bg', theme.header);
            document.documentElement.style.setProperty('--theme-window-bg', theme.windowBg);
            document.documentElement.style.setProperty('--theme-toolbar-bg', theme.toolbarBg);
            document.documentElement.style.setProperty('--theme-footer-bg', theme.footerBg);
            document.documentElement.style.setProperty('--theme-dock-bg', theme.dockBg);
            document.documentElement.style.setProperty('--theme-text', theme.text);
            document.documentElement.style.setProperty('--theme-editor-bg', theme.editorBg);
            document.documentElement.style.setProperty('--theme-editor-text', theme.editorText);
            document.documentElement.style.setProperty('--theme-btn-bg', theme.btnBg);
            document.documentElement.style.setProperty('--theme-btn-text', theme.btnText);
            document.documentElement.style.setProperty('--theme-btn-hover-bg', theme.btnHoverBg);
            document.documentElement.style.setProperty('--theme-desktop-label', theme.desktopLabel);

            localStorage.setItem('y2k_notion_theme_key', key);
        }

        function toggleColorSettingsModal() {
            document.getElementById('color-settings-modal').classList.toggle('hidden');
        }

        function applyWallpaperStyle(url) {
            const bgContainer = document.getElementById('wallpaper-bg');
            bgContainer.style.backgroundImage = `url('${url}')`;
            currentWallpaper = url;
        }

        function setWallpaper(url) {
            applyWallpaperStyle(url);
            saveState();
        }

        function setWallpaperFromInput() {
            const input = document.getElementById('wallpaper-url-input');
            if (input && input.value.trim() !== '') {
                setWallpaper(input.value.trim());
                input.value = '';
            }
        }

        function handleWallpaperUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    setWallpaper(e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function toggleThemeMenu() {
            document.getElementById('wallpaper-menu').classList.toggle('hidden');
        }

        function setupDragAndDropWallpaper() {
            const body = document.body;
            const overlay = document.getElementById('drop-overlay');

            ['dragenter', 'dragover'].forEach(eventName => {
                body.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    overlay.classList.remove('hidden');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                body.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    overlay.classList.add('hidden');
                }, false);
            });

            body.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files && files.length > 0 && files[0].type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (re) => setWallpaper(re.target.result);
                    reader.readAsDataURL(files[0]);
                }
            }, false);
        }

        function getRandomPosition(index) {
            const paddingX = 40;
            const paddingTop = 40;
            const paddingBottom = 120;
            
            const availWidth = Math.max(280, window.innerWidth - 100);
            const availHeight = Math.max(280, window.innerHeight - paddingTop - paddingBottom);

            const x = paddingX + Math.random() * (availWidth - paddingX);
            const y = paddingTop + Math.random() * availHeight;

            return { x: Math.round(x), y: Math.round(y) };
        }

        function shuffleItems() {
            desktopItems.forEach((item, idx) => {
                const pos = getRandomPosition(idx);
                item.x = pos.x;
                item.y = pos.y;
            });
            saveState();
            renderDesktop();
        }

        function renderDesktop() {
            const area = document.getElementById('desktop-area');
            area.innerHTML = '';

            desktopItems.forEach((item) => {
                const el = document.createElement('div');
                el.className = 'desktop-item flex flex-col items-center justify-center p-2 rounded-2xl w-20 sm:w-24 select-none';
                el.style.left = `${item.x}px`;
                el.style.top = `${item.y}px`;

                let iconHtml = '';
                if (item.icon.startsWith('http') || item.icon.startsWith('data:image')) {
                    iconHtml = `<img src="${item.icon}" alt="${item.title}" class="w-10 h-10 sm:w-12 sm:h-12 object-contain pointer-events-none">`;
                } else {
                    iconHtml = `<span class="text-3xl sm:text-4xl pointer-events-none">${item.icon}</span>`;
                }

                el.innerHTML = `
                    <div class="icon-wrapper flex items-center justify-center mb-1">
                        ${iconHtml}
                    </div>
                    <span class="desktop-label text-[11px] font-medium text-center line-clamp-2 w-full">${item.title}</span>
                `;

                makeDraggable(el, item);

                el.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    openWindow(item);
                });

                let lastTap = 0;
                el.addEventListener('touchend', (e) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 350 && tapLength > 0) {
                        openWindow(item);
                        e.preventDefault();
                    }
                    lastTap = currentTime;
                });

                area.appendChild(el);
            });
        }

        function makeDraggable(element, item) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            function onStart(e) {
                isDragging = true;
                element.classList.add('dragging');

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialX = item.x;
                initialY = item.y;

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
            }

            function onMove(e) {
                if (!isDragging) return;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                let newX = initialX + dx;
                let newY = initialY + dy;

                newX = Math.max(5, Math.min(window.innerWidth - 85, newX));
                newY = Math.max(5, Math.min(window.innerHeight - 110, newY));

                item.x = newX;
                item.y = newY;

                element.style.left = `${newX}px`;
                element.style.top = `${newY}px`;
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                element.classList.remove('dragging');

                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);

                saveState();
            }

            element.addEventListener('mousedown', onStart);
            element.addEventListener('touchstart', onStart, { passive: true });
        }

        function openWindow(item) {
            const container = document.getElementById('windows-container');
            let winEl = document.getElementById(`win-${item.id}`);

            winEl.style.left = `${leftPos}px`;
            winEl.style.top = `${topPos}px`;

            let iconHtml = item.icon.startsWith('http') || item.icon.startsWith('data:image')

                    <div class="flex items-center gap-1.5">
                        <button onclick="minimizeWindow('${item.id}')" class="y2k-action-btn" title="Minimizar"><i data-lucide="minus" class="w-3.5 h-3.5"></i></button>
                        <button onclick="toggleHeartLike(this)" class="y2k-action-btn" title="Favorito"><i data-lucide="heart" class="w-3.5 h-3.5"></i></button>
                        <button onclick="closeWindow('${item.id}')" class="y2k-action-btn" title="Cerrar"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>

                <div class="y2k-toolbar px-4 py-1.5 flex items-center justify-between gap-2 overflow-x-auto custom-scroll">
                    <div class="flex items-center gap-1">
                        <button class="y2k-btn-pill px-2.5 py-0.5">back</button>
                        <button class="y2k-btn-pill px-2.5 py-0.5">rules</button>
                        <button class="y2k-btn-pill px-2.5 py-0.5">likes</button>
                    </div>

                    <div class="flex items-center gap-1">
                        <button onclick="execCmdInWin('${item.id}', 'bold')" class="y2k-btn-pill px-2 py-0.5"><b>B</b></button>
                        <button onclick="execCmdInWin('${item.id}', 'italic')" class="y2k-btn-pill px-2 py-0.5"><i>I</i></button>
                        <button onclick="execCmdInWin('${item.id}', 'insertUnorderedList')" class="y2k-btn-pill px-2 py-0.5"><i data-lucide="list" class="w-3 h-3"></i></button>
                        <button onclick="promptInsertImageURL('${item.id}')" class="y2k-btn-pill px-2 py-0.5">
                            <i data-lucide="link" class="w-3 h-3 mr-1"></i> URL Img
                        </button>
                        <label class="y2k-btn-pill px-2 py-0.5 active cursor-pointer">
                            <i data-lucide="image-plus" class="w-3 h-3 mr-1"></i> Subir
                            <input type="file" accept="image/*" class="hidden" onchange="handleImageUploadInline('${item.id}', event)">

                    </div>
                </div>

                <div class="p-4 overflow-y-auto custom-scroll flex-1" onclick="bringToFront('${item.id}')">
                    <div id="editor-${item.id}" contenteditable="true" data-placeholder="Escribe tu nota aquí e inserta imágenes como en Word..." class="rich-note-editor border border-inherit rounded-2xl p-4 text-xs sm:text-sm shadow-inner focus:outline-none leading-relaxed min-h-[180px]" oninput="saveNoteContent('${item.id}')">${item.content || ''}</div>
                </div>

                <div class="y2k-footer px-4 py-2 flex justify-between items-center text-[11px] font-medium">
                    <span class="opacity-70">Guardado automáticamente</span>
                    <button onclick="deleteDesktopItem('${item.id}')" class="y2k-btn-pill px-3 py-1 !text-rose-500 hover:!bg-rose-50">Eliminar Nota</button>
                </div>
            `;

            container.appendChild(winEl);
            makeWindowDraggable(winEl, item.id);

            openWindows[item.id] = { minified: false, zIndex: globalZIndex };
            updateDynamicDock();
            lucide.createIcons();
        }

        function execCmdInWin(winId, command, value = null) {
            const editor = document.getElementById(`editor-${winId}`);
            if (editor) {
                editor.focus();
                document.execCommand(command, false, value);
                saveNoteContent(winId);
            }
        }

        function bringToFront(id) {
            const winEl = document.getElementById(`win-${id}`);
            if (winEl) {
                globalZIndex += 1;
                winEl.style.zIndex = globalZIndex;
                if (openWindows[id]) {
                    openWindows[id].zIndex = globalZIndex;
                }
            }
        }

        function minimizeWindow(id) {
            const winEl = document.getElementById(`win-${id}`);
            if (winEl) {
                winEl.style.transform = 'scale(0.8)';
                winEl.style.opacity = '0';
                setTimeout(() => {
                    winEl.style.display = 'none';
                    if (openWindows[id]) openWindows[id].minified = true;
                    updateDynamicDock();
                }, 150);
            }
        }

        function closeWindow(id) {
            const winEl = document.getElementById(`win-${id}`);
            if (winEl) {
                winEl.remove();
                delete openWindows[id];
                updateDynamicDock();
            }
        }

        function toggleDockApp(id) {
            const winState = openWindows[id];
            const item = desktopItems.find(i => i.id === id);

            if (!winState) {
                if (item) openWindow(item);
            } else if (winState.minified) {
                openWindow(item);
            } else {
                minimizeWindow(id);
            }
        }

        function updateDynamicDock() {
            const container = document.getElementById('dock-dynamic-apps');
            container.innerHTML = '';

            Object.keys(openWindows).forEach((id) => {
                const item = desktopItems.find(i => i.id === id);
                if (!item) return;

                const btn = document.createElement('button');
                btn.onclick = () => toggleDockApp(id);
                btn.className = `dock-btn p-2.5 rounded-2xl shrink-0 ${!openWindows[id].minified ? 'active-win' : ''}`;

                let iconHtml = item.icon.startsWith('http') || item.icon.startsWith('data:image') 
                    ? `<img src="${item.icon}" class="w-5 h-5 object-contain">`
                    : `<span class="text-base">${item.icon}</span>`;

                btn.innerHTML = `
                    ${iconHtml}
                    <div class="dock-dot"></div>
                    <span class="tooltip px-3 py-1 text-[11px] font-semibold">${item.title}</span>
                `;

                container.appendChild(btn);
            });
        }

        function saveEditorSelection(id) {
            const editor = document.getElementById(`editor-${id}`);
            if (!editor) return;
            
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
                savedRangeForUrl = sel.getRangeAt(0).cloneRange();
            } else {
                savedRangeForUrl = null;
            }
        }

        function openImageUrlModal(id) {
            activeEditorForUrl = id;
            saveEditorSelection(id);
            const modal = document.getElementById('image-url-modal');
            const input = document.getElementById('image-url-input-field');
            if (input) input.value = '';
            if (modal) modal.classList.remove('hidden');
        }

        function closeImageUrlModal() {
            const modal = document.getElementById('image-url-modal');
            if (modal) modal.classList.add('hidden');
            activeEditorForUrl = null;
            savedRangeForUrl = null;
        }

        function handleConfirmImageUrl(event) {
            event.preventDefault();
            const input = document.getElementById('image-url-input-field');
            const url = input ? input.value.trim() : '';

            if (url && activeEditorForUrl) {
                insertInlineImageHtml(activeEditorForUrl, url);
            }
            closeImageUrlModal();
        }

        function insertInlineImageHtml(id, src) {
            const editor = document.getElementById(`editor-${id}`);
            if (!editor) return;

            editor.focus();

            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'inline-img-wrapper align-left';
            imgWrapper.contentEditable = 'false';

            imgWrapper.innerHTML = `
                <div class="img-toolbar">
                    <button onclick="alignInlineImg(this, 'left')" title="Alinear Izquierda">←</button>
                    <button onclick="alignInlineImg(this, 'center')" title="Centrar">↔</button>
                    <button onclick="alignInlineImg(this, 'right')" title="Alinear Derecha">→</button>
                    <button onclick="resizeInlineImg(this, 50)" title="Ancho 50%">50%</button>
                    <button onclick="resizeInlineImg(this, 100)" title="Ancho 100%">100%</button>
                    <button onclick="removeInlineImg(this)" title="Eliminar" class="!text-rose-500">✕</button>
                </div>
                <img src="${src}" style="width: 200px;" onerror="this.onerror=null; this.src='https://placehold.co/300x200/fce0e6/ec4899?text=Error+Cargar+Imagen';">
            `;

            const sel = window.getSelection();
            let inserted = false;

            if (savedRangeForUrl && editor.contains(savedRangeForUrl.commonAncestorContainer)) {
                try {
                    savedRangeForUrl.deleteContents();
                    savedRangeForUrl.insertNode(imgWrapper);
                    
                    const newRange = document.createRange();
                    newRange.setStartAfter(imgWrapper);
                    newRange.setEndAfter(imgWrapper);
                    if (sel) {
                        sel.removeAllRanges();
                        sel.addRange(newRange);
                    }
                    inserted = true;
                } catch(e) {
                    inserted = false;
                }
            }

            if (!inserted) {
                editor.appendChild(imgWrapper);
            }

            saveNoteContent(id);
        }

        function promptInsertImageURL(id) {
            openImageUrlModal(id);
        }

        function handleImageUploadInline(id, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    insertInlineImageHtml(id, e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function alignInlineImg(btn, align) {
            const wrapper = btn.closest('.inline-img-wrapper');
            if (wrapper) {
                wrapper.classList.remove('align-left', 'align-center', 'align-right', 'align-full');
                wrapper.classList.add(`align-${align}`);
                const editor = wrapper.closest('.rich-note-editor');
                if (editor) {
                    const winId = editor.id.replace('editor-', '');
                    saveNoteContent(winId);
                }
            }
        }

        function resizeInlineImg(btn, percent) {
            const wrapper = btn.closest('.inline-img-wrapper');
            if (wrapper) {
                const img = wrapper.querySelector('img');
                if (img) {
                    if (percent === 100) {
                        wrapper.classList.add('align-full');
                        img.style.width = '100%';
                    } else {
                        wrapper.classList.remove('align-full');
                        img.style.width = `${percent}%`;
                    }
                }
                const editor = wrapper.closest('.rich-note-editor');
                if (editor) {
                    const winId = editor.id.replace('editor-', '');
                    saveNoteContent(winId);
                }
            }
        }

        function removeInlineImg(btn) {
            const wrapper = btn.closest('.inline-img-wrapper');
            if (wrapper) {
                const editor = wrapper.closest('.rich-note-editor');
                wrapper.remove();
                if (editor) {
                    const winId = editor.id.replace('editor-', '');
                    saveNoteContent(winId);
                }
            }
        }

        function saveNoteContent(id) {
            const item = desktopItems.find(i => i.id === id);
            const editor = document.getElementById(`editor-${id}`);
            if (item && editor) {
                item.content = editor.innerHTML;
                saveState();
            }
        }

        function updateItemTitle(id, newTitle) {
            const item = desktopItems.find(i => i.id === id);
            if (item) {
                item.title = newTitle || 'Sin título';
                saveState();
                renderDesktop();
                updateDynamicDock();
            }
        }

        function deleteDesktopItem(id) {
            closeWindow(id);
            desktopItems = desktopItems.filter(i => i.id !== id);
            saveState();
            renderDesktop();
        }

        function toggleHeartLike(btn) {
            btn.classList.toggle('!text-rose-500');
            btn.classList.toggle('!border-rose-300');
        }

        function makeWindowDraggable(winEl, id) {
            const header = winEl.querySelector('.y2k-header');
            let isDragging = false;
            let offsetX, offsetY;

            header.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                isDragging = true;
                bringToFront(id);
                offsetX = e.clientX - winEl.offsetLeft;
                offsetY = e.clientY - winEl.offsetTop;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                winEl.style.left = `${e.clientX - offsetX}px`;
                winEl.style.top = `${e.clientY - offsetY}px`;
            });

            document.addEventListener('mouseup', () => { isDragging = false; });
        }

        function openNewModal() {
            document.getElementById('new-item-modal').classList.remove('hidden');
        }

        function closeNewModal() {
            document.getElementById('new-item-modal').classList.add('hidden');
        }

        function handleCreateItem(event) {
            event.preventDefault();
            const title = document.getElementById('item-title').value;
            const icon = document.getElementById('item-icon').value || '🌸';
            const noteBody = document.getElementById('item-note-body').value;

            const pos = getRandomPosition(desktopItems.length);

            const newItem = {
                id: Date.now().toString(),
                title,
                icon,
                content: noteBody ? noteBody.replace(/\n/g, '<br>') : '',
                x: pos.x,
                y: pos.y
            };

            desktopItems.push(newItem);
            saveState();
            renderDesktop();
            closeNewModal();
            document.getElementById('new-item-form').reset();
            openWindow(newItem);
        }

        function resetDesktop() {
            desktopItems = JSON.parse(JSON.stringify(defaultItems));
            currentWallpaper = defaultWallpaper;
            setWallpaper(defaultWallpaper);
            applyPresetTheme('pink');
            
            Object.keys(openWindows).forEach(id => closeWindow(id));
            shuffleItems();
        }
    </script>
</body>
</html>
