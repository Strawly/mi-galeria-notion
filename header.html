<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Header Widget</title>
  <!-- Fuentes desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* Reset total y transparencia para evitar marcos blancos en Notion */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: border-box;
    }

    /* Tipografías */
    .font-serif { font-family: 'Georgia', 'Times New Roman', serif; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'Courier New', Courier, monospace; }
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-script { font-family: 'Dancing Script', cursive; }

    /* Tarjeta Principal */
    .widget-card {
      position: relative;
      width: 100%;
      max-width: 650px;
      padding: 22px 26px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Botón ⚙️ visible */
    .config-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .config-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* Fila del Título */
    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 6px;
    }

    .icon-side {
      font-size: 22px;
      user-select: none;
    }

    .main-title {
      font-size: 38px;
      font-weight: bold;
      outline: none;
      border-radius: 6px;
      padding: 2px 8px;
      text-align: center;
      transition: background-color 0.2s ease;
    }

    .main-title:hover, .main-title:focus {
      background-color: rgba(0, 0, 0, 0.05);
    }

    /* Fila Inferior: Fecha + Texto */
    .subheader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-top: 4px;
      padding: 0 8px;
    }

    .date-input {
      font-style: italic;
      font-size: 15px;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
    }

    .right-text {
      font-style: italic;
      font-size: 15px;
      outline: none;
      border: none;
      background: transparent;
      text-align: right;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }

    .right-text:hover, .right-text:focus {
      background-color: rgba(0, 0, 0, 0.05);
    }

    /* Ventana Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #ffffff;
      padding: 22px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      font-size: 16px;
      margin-bottom: 14px;
      color: #333;
      font-family: sans-serif;
    }

    .form-group {
      margin-bottom: 12px;
      font-family: sans-serif;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }

    .form-group select, .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: sans-serif;
    }

    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-primary { background: #6b8e4e; color: #fff; }
  </style>
</head>
<body>

  <div class="widget-card font-serif" id="widgetCard">
    <button class="config-btn" id="openModalBtn" title="Ajustes">⚙️</button>

    <!-- Título -->
    <div class="title-row">
      <span class="icon-side" id="iconLeft">🍄</span>
      <div class="main-title" id="mainTitle" contenteditable="true" spellcheck="false">Title Here</div>
      <span class="icon-side" id="iconRight">🍄</span>
    </div>

    <!-- Fecha y Subtítulo -->
    <div class="subheader-row">
      <div class="date-container">
        <input type="date" class="date-input font-serif" id="datePicker">
      </div>
      <div class="right-text" id="subText" contenteditable="true" spellcheck="false">Insert subheader here</div>
    </div>
  </div>

  <!-- Modal de Personalización -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Personalizar Widget</h2>
      
      <!-- Selector de Fuente -->
      <div class="form-group">
        <label for="fontSelect">Tipo de Fuente:</label>
        <select id="fontSelect">
          <option value="font-serif">Georgia (Serif Clásica)</option>
          <option value="font-playfair">Playfair Display (Elegante)</option>
          <option value="font-sans">Inter (Sans-Serif Moderna)</option>
          <option value="font-mono">Courier (Retro / Monospace)</option>
          <option value="font-script">Dancing Script (Cursiva Estética)</option>
        </select>
      </div>

      <!-- Selector de Paleta / Tema -->
      <div class="form-group">
        <label for="themeSelect">Paleta de Color / Gradiente:</label>
        <select id="themeSelect">
          <option value="sage">Verde Oliva & Beige (Original)</option>
          <option value="blush">Rosa Pastel & Nude</option>
          <option value="sky">Azul Celeste & Menta</option>
          <option value="grad-sunset">Gradiente Atardecer (Rosa-Naranja)</option>
          <option value="grad-aurora">Gradiente Aurora (Verde-Azul)</option>
          <option value="grad-lavender">Gradiente Lavanda (Púrpura-Rosa)</option>
          <option value="custom">Personalizado (Ingresar Color/HEX)</option>
        </select>
      </div>

      <!-- Campo de color personalizado -->
      <div class="form-group" id="customColorGroup" style="display: none;">
        <label for="customBgInput">Color o Gradiente CSS:</label>
        <input type="text" id="customBgInput" placeholder="#f7f6f0 o linear-gradient(...)">
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeModalBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // Referencias al DOM
    const widgetCard = document.getElementById('widgetCard');
    const mainTitle = document.getElementById('mainTitle');
    const datePicker = document.getElementById('datePicker');
    const subText = document.getElementById('subText');
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveBtn = document.getElementById('saveBtn');
    const fontSelect = document.getElementById('fontSelect');
    const themeSelect = document.getElementById('themeSelect');
    const customColorGroup = document.getElementById('customColorGroup');
    const customBgInput = document.getElementById('customBgInput');

    const today = new Date().toISOString().split('T')[0];

    // Presets de Paletas y Gradientes
    const themes = {
      'sage': { bg: '#f7f6f0', text: '#6b8e4e', subtext: '#8fa376' },
      'blush': { bg: '#fdf3f2', text: '#b86b77', subtext: '#c98a94' },
      'sky': { bg: '#f0f7f9', text: '#4a7c8e', subtext: '#729ea8' },
      'grad-sunset': { bg: 'linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%)', text: '#4a3e56', subtext: '#685977' },
      'grad-aurora': { bg: 'linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%)', text: '#2d5233', subtext: '#3d6d45' },
      'grad-lavender': { bg: 'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)', text: '#433854', subtext: '#5b4d70' }
    };

    // Cargar datos
    let currentFont = localStorage.getItem('hdr_font') || 'font-serif';
    let currentTheme = localStorage.getItem('hdr_theme') || 'sage';
    let customBg = localStorage.getItem('hdr_custom_bg') || '#f7f6f0';

    mainTitle.innerText = localStorage.getItem('hdr_title') || 'Title Here';
    datePicker.value = localStorage.getItem('hdr_date') || today;
    subText.innerText = localStorage.getItem('hdr_text') || 'Insert subheader here';

    function applyStyles(fontClass, themeKey, customVal) {
      widgetCard.className = `widget-card ${fontClass}`;
      datePicker.className = `date-input ${fontClass}`;

      if (themeKey === 'custom') {
        widgetCard.style.background = customVal;
        widgetCard.style.color = '#333';
        mainTitle.style.color = '#333';
        datePicker.style.color = '#666';
        subText.style.color = '#666';
      } else {
        const theme = themes[themeKey] || themes['sage'];
        widgetCard.style.background = theme.bg;
        widgetCard.style.color = theme.text;
        mainTitle.style.color = theme.text;
        datePicker.style.color = theme.subtext;
        subText.style.color = theme.subtext;
      }
    }

    applyStyles(currentFont, currentTheme, customBg);

    // Guardado de textos
    mainTitle.addEventListener('input', () => localStorage.setItem('hdr_title', mainTitle.innerText));
    datePicker.addEventListener('change', () => localStorage.setItem('hdr_date', datePicker.value));
    subText.addEventListener('input', () => localStorage.setItem('hdr_text', subText.innerText));

    // Mostrar/ocultar input personalizado en modal
    themeSelect.addEventListener('change', () => {
      if (themeSelect.value === 'custom') {
        customColorGroup.style.display = 'block';
      } else {
        customColorGroup.style.display = 'none';
      }
    });

    // Abrir Modal
    openModalBtn.addEventListener('click', () => {
      fontSelect.value = currentFont;
      themeSelect.value = currentTheme;
      customBgInput.value = customBg;
      customColorGroup.style.display = currentTheme === 'custom' ? 'block' : 'none';
      modalOverlay.classList.add('active');
    });

    // Cerrar Modal
    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    // Guardar Modal
    saveBtn.addEventListener('click', () => {
      currentFont = fontSelect.value;
      currentTheme = themeSelect.value;
      customBg = customBgInput.value.trim() || '#f7f6f0';

      localStorage.setItem('hdr_font', currentFont);
      localStorage.setItem('hdr_theme', currentTheme);
      localStorage.setItem('hdr_custom_bg', customBg);

      applyStyles(currentFont, currentTheme, customBg);
      modalOverlay.classList.remove('active');
    });
  </script>
</body>
</html>
