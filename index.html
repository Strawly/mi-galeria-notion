<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Photo Gallery Widget</title>
  <style>
    /* Reset total y transparencia estricta para eliminar cualquier marco blanco */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    /* Contenedor con tamaño mínimo fijo para evitar deformación/estiramiento */
    .gallery-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px; /* Asegura un alto fijo base */
      padding: 12px;
      border-radius: 20px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Botón flotante de configuración */
    .config-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      opacity: 0.4;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .gallery-container:hover .config-btn,
    .config-btn:hover {
      opacity: 1;
      transform: scale(1.08);
    }

    /* Cuadrícula rígida fija (se mantiene idéntica sin estirarse al reducir) */
    .gallery-grid {
      display: grid;
      gap: 12px;
      width: 100%;
      height: 100%;
      min-height: 400px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background-color: rgba(229, 229, 229, 0.4);
      width: 100%;
      height: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Evita que la foto se deforme o aplaste */
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    /* Diseños por número de imágenes */
    .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }

    .grid-3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-3 .item-0 { grid-column: 1 / 2; grid-row: 1 / 3; }
    .grid-3 .item-1 { grid-column: 2 / 3; grid-row: 1 / 2; }
    .grid-3 .item-2 { grid-column: 2 / 3; grid-row: 2 / 3; }

    .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    /* 5 imágenes con proporciones exactas como la foto de referencia */
    .grid-5 { grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1.3fr 1fr; }
    .grid-5 .item-0 { grid-column: 1 / 3; grid-row: 1 / 2; }
    .grid-5 .item-1 { grid-column: 3 / 4; grid-row: 1 / 2; }
    .grid-5 .item-2 { grid-column: 1 / 2; grid-row: 2 / 3; }
    .grid-5 .item-3 { grid-column: 2 / 3; grid-row: 2 / 3; }
    .grid-5 .item-4 { grid-column: 3 / 4; grid-row: 2 / 3; }

    /* Modal de Configuración */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .modal h2 {
      font-size: 16px;
      margin-bottom: 14px;
      color: #222;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #444;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #0070f3;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .btn-secondary { background: #eee; color: #333; }
    .btn-primary { background: #0070f3; color: #fff; }
  </style>
</head>
<body>

  <div class="gallery-container" id="galleryContainer">
    <button class="config-btn" id="openModalBtn" title="Configurar Galería">⚙️</button>
    <div class="gallery-grid grid-5" id="galleryGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Configurar Galería</h2>
      
      <div class="form-group">
        <label for="bgInput">URL Imagen de Fondo (Opcional):</label>
        <input type="text" id="bgInput" placeholder="https://ejemplo.com/fondo.jpg">
      </div>

      <div class="form-group">
        <label for="imageCount">Cantidad de fotos (1 a 5):</label>
        <select id="imageCount">
          <option value="1">1 Imagen</option>
          <option value="2">2 Imágenes</option>
          <option value="3">3 Imágenes</option>
          <option value="4">4 Imágenes</option>
          <option value="5" selected>5 Imágenes (Diseño Referencia)</option>
        </select>
      </div>

      <div id="urlInputsContainer"></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeModalBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script>
    const defaults = [
      "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=1000&q=80",
      "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",
      "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=600&q=80",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80",
      "https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=600&q=80"
    ];

    function getStoredData(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function setStoredData(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        console.warn('LocalStorage inaccesible:', e);
      }
    }

    let count = getStoredData('notion_gal_count', 5);
    let images = getStoredData('notion_gal_images', []);
    let bgUrl = getStoredData('notion_gal_bg', '');

    const galleryContainer = document.getElementById('galleryContainer');
    const galleryGrid = document.getElementById('galleryGrid');
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveBtn = document.getElementById('saveBtn');
    const imageCountSelect = document.getElementById('imageCount');
    const bgInput = document.getElementById('bgInput');
    const urlInputsContainer = document.getElementById('urlInputsContainer');

    function renderGallery() {
      if (bgUrl && bgUrl.trim() !== '') {
        galleryContainer.style.backgroundImage = `url('${bgUrl}')`;
      } else {
        galleryContainer.style.backgroundImage = 'none';
      }

      galleryGrid.className = `gallery-grid grid-${count}`;
      galleryGrid.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const item = document.createElement('div');
        item.className = `gallery-item item-${i}`;

        const img = document.createElement('img');
        const srcToUse = (images[i] && images[i].trim() !== '') ? images[i] : defaults[i % defaults.length];
        
        img.src = srcToUse;
        img.alt = `Foto ${i + 1}`;
        img.onerror = function() {
          this.src = defaults[i % defaults.length];
        };

        item.appendChild(img);
        galleryGrid.appendChild(item);
      }
    }

    function renderInputs() {
      urlInputsContainer.innerHTML = '';
      const selectedCount = parseInt(imageCountSelect.value);

      for (let i = 0; i < selectedCount; i++) {
        const group = document.createElement('div');
        group.className = 'form-group';

        const label = document.createElement('label');
        label.innerText = `URL Foto ${i + 1}:`;

        const input = document.createElement('input');
        input.type = 'text';
        input.value = images[i] || '';
        input.placeholder = defaults[i % defaults.length];
        input.classList.add('url-input-item');

        group.appendChild(label);
        group.appendChild(input);
        urlInputsContainer.appendChild(group);
      }
    }

    openModalBtn.addEventListener('click', () => {
      imageCountSelect.value = count;
      bgInput.value = bgUrl;
      renderInputs();
      modalOverlay.classList.add('active');
    });

    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    imageCountSelect.addEventListener('change', renderInputs);

    saveBtn.addEventListener('click', () => {
      count = parseInt(imageCountSelect.value);
      bgUrl = bgInput.value.trim();

      const inputElements = urlInputsContainer.querySelectorAll('.url-input-item');
      images = [];

      inputElements.forEach((input, idx) => {
        images[idx] = input.value.trim();
      });

      setStoredData('notion_gal_count', count);
      setStoredData('notion_gal_images', images);
      setStoredData('notion_gal_bg', bgUrl);

      renderGallery();
      modalOverlay.classList.remove('active');
    });

    renderGallery();
  </script>
</body>
</html>
