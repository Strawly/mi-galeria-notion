<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Photo Gallery Widget</title>
  <style>
    /* Reset total para eliminar bordes y márgenes blancos */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: transparent; /* Evita cualquier fondo blanco */
      overflow: hidden; /* Evita barras de scroll dobles en Notion */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Contenedor adaptativo de borde a borde */
    .gallery-container {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 8px; /* Un pequeño respiro interno para las esquinas, ajustable */
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Botón de configuración flotante más discreto */
    .config-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      opacity: 0; /* Oculto por defecto para un look más limpio */
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .gallery-container:hover .config-btn,
    .config-btn:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Grilla responsiva que no se deforma */
    .gallery-grid {
      display: grid;
      gap: 8px; /* Reducido para pantallas más compactas */
      width: 100%;
      height: 100%;
      max-height: 100%;
      /* Usamos grid de 12 columnas para un control total y flexible */
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(12, 1fr);
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background-color: rgba(229, 229, 229, 0.3);
      width: 100%;
      height: 100%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Evita que las imágenes se aplasten */
      object-position: center;
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.02);
    }

    /* Diseños adaptativos (Basados en cuadrícula 12x12) */
    
    /* 1 imagen */
    .grid-1 .item-0 { grid-column: 1 / 13; grid-row: 1 / 13; }

    /* 2 imágenes */
    .grid-2 .item-0 { grid-column: 1 / 7; grid-row: 1 / 13; }
    .grid-2 .item-1 { grid-column: 7 / 13; grid-row: 1 / 13; }

    /* 3 imágenes */
    .grid-3 .item-0 { grid-column: 1 / 8; grid-row: 1 / 13; }
    .grid-3 .item-1 { grid-column: 8 / 13; grid-row: 1 / 7; }
    .grid-3 .item-2 { grid-column: 8 / 13; grid-row: 7 / 13; }

    /* 4 imágenes */
    .grid-4 .item-0 { grid-column: 1 / 7; grid-row: 1 / 7; }
    .grid-4 .item-1 { grid-column: 7 / 13; grid-row: 1 / 7; }
    .grid-4 .item-2 { grid-column: 1 / 7; grid-row: 7 / 13; }
    .grid-4 .item-3 { grid-column: 7 / 13; grid-row: 7 / 13; }

    /* 5 imágenes (Idéntico a la referencia pero totalmente flexible) */
    .grid-5 .item-0 { grid-column: 1 / 9; grid-row: 1 / 7; }   /* Superior izquierda horizontal grande */
    .grid-5 .item-1 { grid-column: 9 / 13; grid-row: 1 / 7; }  /* Superior derecha vertical */
    .grid-5 .item-2 { grid-column: 1 / 5; grid-row: 7 / 13; }  /* Inferior izquierda 1 */
    .grid-5 .item-3 { grid-column: 5 / 9; grid-row: 7 / 13; }  /* Inferior centro 2 */
    .grid-5 .item-4 { grid-column: 9 / 13; grid-row: 7 / 13; } /* Inferior derecha 3 */

    /* Reglas para pantallas muy angostas (Móvil / Formato vertical Notion) */
    @media (max-width: 480px) {
      .gallery-grid {
        gap: 6px;
      }
      
      /* Reacomodo para que 5 imágenes no se aplasten horizontalmente */
      .grid-5 .item-0 { grid-column: 1 / 13; grid-row: 1 / 5; }  /* Pasa a ocupar todo el ancho arriba */
      .grid-5 .item-1 { grid-column: 1 / 13; grid-row: 5 / 8; }  /* Ocupa el centro */
      .grid-5 .item-2 { grid-column: 1 / 5; grid-row: 8 / 13; }  /* Las 3 de abajo se aprietan menos */
      .grid-5 .item-3 { grid-column: 5 / 9; grid-row: 8 / 13; }
      .grid-5 .item-4 { grid-column: 9 / 13; grid-row: 8 / 13; }
    }

    /* Modal de Configuración */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #ffffff;
      padding: 20px;
      border-radius: 14px;
      width: 90%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #111;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #333;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #0070f3;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
