<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Escritorio Y2K Multitarea Notion</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        /* DYNAMIC CSS VARIABLES SYSTEM FOR THEME CUSTOMIZATION */
        :root {
            --theme-accent: #ec4899;
            --theme-accent-hover: #db2777;
            --theme-accent-light: #fce7f3;
            --theme-header-bg: linear-gradient(180deg, #fce0e6 0%, #f7d2db 60%, #ffffff 100%);
            --theme-window-bg: rgba(255, 255, 255, 0.95);
            --theme-border: #e8d0d8;
            --theme-dock-bg: rgba(255, 255, 255, 0.75);
            --theme-text-primary: #5a4b51;
            --theme-text-accent: #db2777;
            --theme-shadow: rgba(225, 175, 200, 0.45);
        }

        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            touch-action: none;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--theme-accent-light);
        }

        /* WALLPAPER CONTAINER */
        #wallpaper-bg {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.4s ease-in-out;
            width: 100vw;
            height: 100vh;
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* Y2K / SOFT PASTEL WINDOW STYLING */
        .y2k-window {
            background: var(--theme-window-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--theme-border);
            box-shadow: 
                0 20px 40px -10px var(--theme-shadow),
                0 10px 20px -5px rgba(0, 0, 0, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border-radius: 22px;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        .y2k-window.minimized {
            transform: scale(0.3) translateY(400px);
            opacity: 0;
            pointer-events: none;
        }

        /* WINDOW HEADER */
        .y2k-header {
            background: var(--theme-header-bg);
            border-bottom: 1px solid var(--theme-border);
        }

        /* PILL BUTTONS */
        .y2k-btn-pill {
            background: #ffffff;
            border: 1px solid var(--theme-border);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            color: var(--theme-text-primary);
            font-size: 11px;
            font-weight: 600;
            transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .y2k-btn-pill:hover {
            transform: translateY(-1.5px) scale(1.03);
            background: #ffffff;
            border-color: var(--theme-accent);
            color: var(--theme-text-accent);
            box-shadow: 0 4px 10px var(--theme-shadow);
        }

        .y2k-btn-pill:active {
            transform: translateY(0.5px) scale(0.98);
        }

        /* ACTION BUTTONS (Close, Minimize, Heart) */
        .y2k-action-btn {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            background: #ffffff;
            border: 1px solid var(--theme-border);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            color: var(--theme-text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .y2k-action-btn:hover {
            transform: scale(1.12);
            background: #ffffff;
            color: var(--theme-accent);
            border-color: var(--theme-accent);
        }

        /* LIQUID GLASS DOCK */
        .liquid-glass-dock {
            background: var(--theme-dock-bg);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 
                0 16px 32px var(--theme-shadow),
                inset 0 1px 2px rgba(255, 255, 255, 0.9);
            border-radius: 24px;
        }

        .dock-btn {
            position: relative;
            background: #ffffff;
            border: 1px solid var(--theme-border);
            color: var(--theme-text-primary);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .dock-btn:hover {
            transform: translateY(-6px) scale(1.15);
            background: #ffffff;
            color: var(--theme-accent);
            border-color: var(--theme-accent);
            box-shadow: 0 8px 16px var(--theme-shadow);
        }

        .dock-btn .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            transition: all 0.2s ease;
            white-space: nowrap;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--theme-border);
            border-radius: 12px;
            color: var(--theme-text-primary);
            box-shadow: 0 10px 20px var(--theme-shadow);
        }

        .dock-btn:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .dock-dot {
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background-color: var(--theme-accent);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--theme-accent);
        }

        /* FLOATING DESKTOP ICONS */
        .desktop-item {
            position: absolute;
            transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            cursor: grab;
            outline: none;
            z-index: 10;
        }

        .desktop-item:active {
            cursor: grabbing;
        }

        .desktop-item.dragging {
            transition: none !important;
            z-index: 1000 !important;
            opacity: 0.9;
            transform: scale(1.1);
        }

        .desktop-item:hover .icon-wrapper {
            transform: translateY(-4px) scale(1.12);
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.22));
        }

        .icon-wrapper {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.18));
        }

        .desktop-label {
            font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.2px;
            color: #ffffff;
            text-shadow: 
                0 1px 3px rgba(0, 0, 0, 0.7),
                0 2px 6px rgba(0, 0, 0, 0.5);
        }

        /* RICH NOTE EDITOR */
        .rich-note-editor {
            user-select: text;
            -webkit-user-select: text;
            outline: none;
            min-height: 160px;
            color: var(--theme-text-primary);
        }

        .rich-note-editor:empty:before {
            content: attr(data-placeholder);
            color: #bfaab3;
            pointer-events: none;
            display: block;
        }

        .rich-note-editor ul {
            list-style-type: disc;
            padding-left: 1.25rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .rich-note-editor ol {
            list-style-type: decimal;
            padding-left: 1.25rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .rich-note-editor b, .rich-note-editor strong {
            font-weight: 700;
            color: var(--theme-text-accent);
        }

        /* COLOR PICKER INPUT STYLING */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid var(--theme-border);
            border-radius: 8px;
        }

        /* SCROLLBAR */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--theme-accent);
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden text-slate-800 relative">

    <!-- WALLPAPER BACKGROUND -->
    <div id="wallpaper-bg"></div>

    <!-- DRAG AND DROP OVERLAY FOR WALLPAPER -->
    <div id="drop-overlay" class="hidden fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/60 backdrop-blur-md text-white pointer-events-none transition-all">
        <i data-lucide="image-plus" class="w-16 h-16 mb-3 animate-bounce text-pink-200"></i>
        <p class="text-base font-bold tracking-wide font-['Fredoka']">Suelta aquí tu nueva imagen de fondo 🌸</p>
        <p class="text-xs opacity-80 mt-1">Soporta JPG, PNG, WEBP y GIF</p>
    </div>

    <!-- DESKTOP AREA -->
    <main id="desktop-area" class="w-full h-full pb-28 relative overflow-hidden z-10"></main>

    <!-- WINDOWS MULTITASKING CONTAINER -->
    <div id="windows-container" class="fixed inset-0 pointer-events-none z-30"></div>

    <!-- LIQUID GLASS DOCK -->
    <nav class="fixed bottom-5 left-1/2 -translate-x-1/2 z-40">
        <div class="liquid-glass-dock px-4 py-2.5 flex items-center gap-2.5" id="dock-container">
            
            <!-- Add Item Button -->
            <button onclick="openNewModal()" class="dock-btn p-2.5 rounded-2xl">
                <i data-lucide="plus" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Añadir Nota / Ícono</span>
            </button>

            <!-- Wallpaper Settings Button -->
            <button onclick="toggleMenu('theme-menu')" class="dock-btn p-2.5 rounded-2xl">
                <i data-lucide="image" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Fondo de Pantalla</span>
            </button>

            <!-- NEW: Color Theme Customizer Button -->
            <button onclick="toggleMenu('color-menu')" class="dock-btn p-2.5 rounded-2xl">
                <i data-lucide="palette" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Ajustes de Tema</span>
            </button>

            <!-- Separator -->
            <div class="h-6 w-[1.5px] bg-slate-300/60 my-auto mx-0.5"></div>

            <!-- DYNAMIC DOCK ITEMS APP CONTAINER -->
            <div id="dock-apps-list" class="flex items-center gap-2"></div>

            <!-- Separator -->
            <div class="h-6 w-[1.5px] bg-slate-300/60 my-auto mx-0.5"></div>

            <!-- Randomize Positions -->
            <button onclick="shuffleItems()" class="dock-btn p-2.5 rounded-2xl">
                <i data-lucide="shuffle" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Aleatorizar Íconos</span>
            </button>

            <!-- Reset Widget -->
            <button onclick="resetDesktop()" class="dock-btn p-2.5 rounded-2xl !text-rose-500 hover:!bg-rose-50">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                <span class="tooltip px-3 py-1 text-[11px] font-semibold">Restablecer Widget</span>
            </button>

        </div>
    </nav>

    <!-- MENU POPUP: WALLPAPER SETTINGS -->
    <div id="theme-menu" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 y2k-window p-5 w-84 sm:w-96 shadow-2xl space-y-4 border border-white">
        <div class="flex justify-between items-center pb-2 border-b border-pink-100">
            <h3 class="text-xs font-bold uppercase tracking-wider text-pink-700 flex items-center gap-2 font-['Fredoka']">
                <i data-lucide="sparkles" class="w-4 h-4 text-pink-500"></i> Fondo de Pantalla
            </h3>
            <button onclick="toggleMenu('theme-menu')" class="y2k-action-btn"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>

        <div class="space-y-1.5">
            <label class="block text-[11px] font-semibold text-slate-600">Pegar URL de Imagen</label>
            <div class="flex gap-2">
                <input type="url" id="wallpaper-url-input" placeholder="https://ejemplo.com/fondo.jpg" class="flex-1 bg-pink-50/50 border border-pink-200 rounded-xl px-3 py-1.5 text-xs text-slate-700 placeholder-pink-300 focus:outline-none focus:border-pink-400">
                <button onclick="setWallpaperFromInput()" class="y2k-btn-pill px-3.5 py-1.5 !bg-pink-400 !text-white !border-pink-300 hover:!bg-pink-500">Aplicar</button>
            </div>
        </div>

        <div class="space-y-1.5">
            <label class="block text-[11px] font-semibold text-slate-600">Subir Imagen Local</label>
            <label class="flex items-center justify-center gap-2 w-full p-2.5 bg-pink-50/60 hover:bg-pink-100/80 border border-dashed border-pink-300 rounded-xl cursor-pointer transition text-xs font-medium text-pink-700">
                <i data-lucide="upload-cloud" class="w-4 h-4 text-pink-500"></i>
                <span>Seleccionar archivo desde el equipo</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleWallpaperUpload(event)">
            </label>
        </div>

        <div class="space-y-1.5">
            <label class="block text-[11px] font-semibold text-slate-600">Presets Pastel & Y2K</label>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="setWallpaper('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1200')" class="h-12 rounded-xl bg-cover bg-center border border-pink-200 hover:scale-105 transition shadow-sm text-[10px] font-bold text-slate-700 flex items-end p-1.5" style="background-image: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=300')"><span class="bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">Pastel Gradient</span></button>
                <button onclick="setWallpaper('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200')" class="h-12 rounded-xl bg-cover bg-center border border-pink-200 hover:scale-105 transition shadow-sm text-[10px] font-bold text-slate-700 flex items-end p-1.5" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=300')"><span class="bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">Soft Waves</span></button>
                <button onclick="setWallpaper('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200')" class="h-12 rounded-xl bg-cover bg-center border border-pink-200 hover:scale-105 transition shadow-sm text-[10px] font-bold text-slate-700 flex items-end p-1.5" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=300')"><span class="bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">Playa Soft</span></button>
                <button onclick="setWallpaper('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1200')" class="h-12 rounded-xl bg-cover bg-center border border-pink-200 hover:scale-105 transition shadow-sm text-[10px] font-bold text-slate-700 flex items-end p-1.5" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=300')"><span class="bg-white/80 backdrop-blur-xs px-1.5 py-0.5 rounded-md">Stars Dark</span></button>
            </div>
        </div>
    </div>

    <!-- NEW: MENU POPUP COLOR THEME CUSTOMIZER -->
    <div id="color-menu" class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-50 y2k-window p-5 w-84 sm:w-96 shadow-2xl space-y-4 border border-white">
        <div class="flex justify-between items-center pb-2 border-b border-pink-100">
            <h3 class="text-xs font-bold uppercase tracking-wider text-pink-700 flex items-center gap-2 font-['Fredoka']">
                <i data-lucide="paint-bucket" class="w-4 h-4 text-pink-500"></i> Personalizador de Tema Y2K
            </h3>
            <button onclick="toggleMenu('color-menu')" class="y2k-action-btn"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>

        <!-- 1. PRESET THEMES -->
        <div class="space-y-1.5">
            <label class="block text-[11px] font-semibold text-slate-600">Paletas Predefinidas</label>
            <div class="grid grid-cols-3 gap-2" id="preset-themes-grid"></div>
        </div>

        <!-- 2. CUSTOM COLOR PICKERS -->
        <div class="space-y-2 pt-2 border-t border-pink-100">
            <label class="block text-[11px] font-semibold text-slate-600">Ajuste Fino de Colores</label>
            
            <div class="grid grid-cols-2 gap-2 text-xs">
                <div class="flex items-center justify-between p-2 rounded-xl bg-white/60 border border-pink-100">
                    <span class="text-[11px] font-medium text-slate-600">Color Acento</span>
                    <input type="color" id="picker-accent" onchange="updateCustomThemeColor('accent', this.value)">
                </div>

                <div class="flex items-center justify-between p-2 rounded-xl bg-white/60 border border-pink-100">
                    <span class="text-[11px] font-medium text-slate-600">Color Bordes</span>
                    <input type="color" id="picker-border" onchange="updateCustomThemeColor('border', this.value)">
                </div>

                <div class="flex items-center justify-between p-2 rounded-xl bg-white/60 border border-pink-100">
                    <span class="text-[11px] font-medium text-slate-600">Fondo Ventana</span>
                    <input type="color" id="picker-window" onchange="updateCustomThemeColor('window', this.value)">
                </div>

                <div class="flex items-center justify-between p-2 rounded-xl bg-white/60 border border-pink-100">
                    <span class="text-[11px] font-medium text-slate-600">Fondo Dock</span>
                    <input type="color" id="picker-dock" onchange="updateCustomThemeColor('dock', this.value)">
                </div>
            </div>
        </div>

        <!-- RESTORE COLOR PALETTE -->
        <div class="pt-2 flex justify-between items-center border-t border-pink-100">
            <span class="text-[10px] text-pink-400 font-medium">Aplicación instantánea</span>
            <button onclick="resetThemePalette()" class="y2k-btn-pill px-3 py-1 !text-rose-500 !border-rose-200 hover:!bg-rose-50">Restablecer Paleta</button>
        </div>
    </div>

    <!-- MODAL FOR NEW ITEM -->
    <div id="new-item-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/30 backdrop-blur-xs">
        <div class="y2k-window w-full max-w-sm p-5 shadow-2xl border border-white space-y-4">
            <div class="flex justify-between items-center border-b border-pink-100 pb-2">
                <h3 class="font-bold text-xs text-pink-700 font-['Fredoka'] flex items-center gap-1.5">
                    <i data-lucide="plus-circle" class="w-4 h-4 text-pink-500"></i> Crear Nuevo Ícono
                </h3>
                <button onclick="closeNewModal()" class="y2k-action-btn"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            </div>

            <form id="new-item-form" onsubmit="handleCreateItem(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nombre / Título</label>
                    <input type="text" id="item-title" required placeholder="Ej: About, Likes..." class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2 text-xs text-slate-700 placeholder-pink-300 focus:outline-none focus:border-pink-400">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Ícono (Emoji o URL PNG)</label>
                    <input type="text" id="item-icon" required placeholder="🌸, 💖, 📂 o URL de PNG" value="🌸" class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2 text-xs text-slate-700 placeholder-pink-300 focus:outline-none focus:border-pink-400">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Texto de Nota</label>
                    <textarea id="item-note-body" rows="3" placeholder="Escribe tu nota..." class="w-full bg-pink-50/50 border border-pink-200 rounded-xl p-2 text-xs text-slate-700 placeholder-pink-300 focus:outline-none focus:border-pink-400 custom-scroll"></textarea>
                </div>

                <div class="pt-2 flex justify-end gap-2 border-t border-pink-100">
                    <button type="button" onclick="closeNewModal()" class="y2k-btn-pill px-3 py-1.5">Cancelar</button>
                    <button type="submit" class="y2k-btn-pill px-4 py-1.5 !bg-pink-400 !text-white !border-pink-300 hover:!bg-pink-500">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT SYSTEM -->
    <script>
        const defaultWallpaper = 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1200';

        // PREDEFINED THEME PALETTES
        const presetPalettes = {
            coquette: {
                name: 'Soft Pink',
                icon: '🌸',
                accent: '#ec4899',
                accentHover: '#db2777',
                accentLight: '#fce7f3',
                headerBg: 'linear-gradient(180deg, #fce0e6 0%, #f7d2db 60%, #ffffff 100%)',
                windowBg: 'rgba(255, 255, 255, 0.95)',
                border: '#e8d0d8',
                dockBg: 'rgba(255, 255, 255, 0.75)',
                textPrimary: '#5a4b51',
                textAccent: '#db2777',
                shadow: 'rgba(225, 175, 200, 0.45)'
            },
            lavender: {
                name: 'Lavender',
                icon: '🍇',
                accent: '#8b5cf6',
                accentHover: '#7c3aed',
                accentLight: '#f3e8ff',
                headerBg: 'linear-gradient(180deg, #ede9fe 0%, #ddd6fe 60%, #ffffff 100%)',
                windowBg: 'rgba(255, 255, 255, 0.95)',
                border: '#ddd6fe',
                dockBg: 'rgba(255, 255, 255, 0.75)',
                textPrimary: '#4c1d95',

        // LOCALSTORAGE MANAGEMENT
        function loadState() {
            const savedItems = localStorage.getItem('y2k_notion_items');
            const savedBg = localStorage.getItem('y2k_notion_bg');
            const savedTheme = localStorage.getItem('y2k_notion_theme');

            desktopItems = savedItems ? JSON.parse(savedItems) : defaultItems;
            currentWallpaper = savedBg || defaultWallpaper;
            
            if (savedTheme) {
                try {
                    currentTheme = JSON.parse(savedTheme);
                } catch(e) {
                    currentTheme = presetPalettes.coquette;
                }
            }

            applyThemeVars(currentTheme);
            applyWallpaperStyle(currentWallpaper);

            desktopItems.forEach((item, index) => {
                if (item.x === undefined || item.y === undefined) {
                    const pos = getRandomPosition(index);
                    item.x = pos.x;
                    item.y = pos.y;
                }
                if (!item.images) item.images = [];
            });
        }

        function saveState() {
            try {
                localStorage.setItem('y2k_notion_items', JSON.stringify(desktopItems));
                localStorage.setItem('y2k_notion_bg', currentWallpaper);
                localStorage.setItem('y2k_notion_theme', JSON.stringify(currentTheme));
            } catch (e) {
                console.warn('Error al guardar en LocalStorage', e);
            }
        }

        // DYNAMIC THEME SYSTEM USING CSS VARIABLES
        function applyThemeVars(theme) {
            const root = document.documentElement;
            root.style.setProperty('--theme-accent', theme.accent);
            root.style.setProperty('--theme-accent-hover', theme.accentHover);
            root.style.setProperty('--theme-accent-light', theme.accentLight);
            root.style.setProperty('--theme-header-bg', theme.headerBg);
            root.style.setProperty('--theme-window-bg', theme.windowBg);
            root.style.setProperty('--theme-border', theme.border);
            root.style.setProperty('--theme-dock-bg', theme.dockBg);
            root.style.setProperty('--theme-text-primary', theme.textPrimary);
            root.style.setProperty('--theme-text-accent', theme.textAccent);
            root.style.setProperty('--theme-shadow', theme.shadow);

            // Update color pickers if element exists
            const pAccent = document.getElementById('picker-accent');
            const pBorder = document.getElementById('picker-border');
            if (pAccent) pAccent.value = theme.accent;
            if (pBorder) pBorder.value = theme.border;
        }

        function applyPresetTheme(key) {
            if (presetPalettes[key]) {
                currentTheme = { ...presetPalettes[key] };
                applyThemeVars(currentTheme);
                saveState();

        }

        function updateCustomThemeColor(type, colorHex) {
            if (type === 'accent') {
                currentTheme.accent = colorHex;
                currentTheme.accentHover = colorHex;
                currentTheme.textAccent = colorHex;
            } else if (type === 'border') {
                currentTheme.border = colorHex;
            } else if (type === 'window') {
                currentTheme.windowBg = colorHex;
            } else if (type === 'dock') {
                currentTheme.dockBg = colorHex;
            }
            applyThemeVars(currentTheme);
            saveState();
        }

        function resetThemePalette() {
            currentTheme = { ...presetPalettes.coquette };
            applyThemeVars(currentTheme);
            saveState();

        // WALLPAPER SYSTEM
        function applyWallpaperStyle(url) {
            const bgContainer = document.getElementById('wallpaper-bg');
            bgContainer.style.backgroundImage = `url('${url}')`;
            currentWallpaper = url;
        }

        function setWallpaper(url) {
            applyWallpaperStyle(url);
            saveState();
        }

        function setWallpaperFromInput() {
            const input = document.getElementById('wallpaper-url-input');
            if (input && input.value.trim() !== '') {
                setWallpaper(input.value.trim());
                input.value = '';
            }
        }

        function handleWallpaperUpload(event) {
            const file = event.target.files[0];
            if (file) {
                processAndSetImageFile(file);
            }
        }

        function processAndSetImageFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Selecciona una imagen válida.');
                return;
            }
            const reader = new FileReader();
            reader.onload = function (e) {
                setWallpaper(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function toggleMenu(id) {
            const menu = document.getElementById(id);
            if (!menu) return;
            const isHidden = menu.classList.contains('hidden');
            document.querySelectorAll('#theme-menu, #color-menu').forEach(m => m.classList.add('hidden'));
            if (isHidden) menu.classList.remove('hidden');
        }

        function setupDragAndDropWallpaper() {
            const body = document.body;
            const overlay = document.getElementById('drop-overlay');

            ['dragenter', 'dragover'].forEach(eventName => {
                body.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    overlay.classList.remove('hidden');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                body.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    overlay.classList.add('hidden');
                }, false);
            });

            body.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files && files.length > 0) {
                    processAndSetImageFile(files[0]);
                }
            }, false);
        }

        // DESKTOP POSITIONING & DRAG
        function getRandomPosition(index) {
            const paddingX = 40;
            const paddingTop = 40;
            const paddingBottom = 120;
            
            const availWidth = Math.max(280, window.innerWidth - 100);
            const availHeight = Math.max(280, window.innerHeight - paddingTop - paddingBottom);

            const x = paddingX + Math.random() * (availWidth - paddingX);
            const y = paddingTop + Math.random() * availHeight;

            return { x: Math.round(x), y: Math.round(y) };
        }

        function shuffleItems() {
            desktopItems.forEach((item, idx) => {
                const pos = getRandomPosition(idx);

        function renderDesktop() {
            const area = document.getElementById('desktop-area');
            area.innerHTML = '';

            desktopItems.forEach((item) => {
                const el = document.createElement('div');

                    iconHtml = `<img src="${item.icon}" alt="${item.title}" class="w-10 h-10 sm:w-12 sm:h-12 object-contain pointer-events-none">`;
                } else {

                }

                el.innerHTML = `

                        ${iconHtml}

                    <span class="desktop-label text-[11px] font-medium text-center line-clamp-2 w-full">${item.title}</span>
                `;

                makeDraggable(el, item);

                // DOUBLE CLICK TO OPEN WINDOW
                el.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    openWindow(item);
                });

                // TOUCH DOUBLE TAP
                let lastTap = 0;
                el.addEventListener('touchend', (e) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 350 && tapLength > 0) {
                        openWindow(item);
                        e.preventDefault();
                    }
                    lastTap = currentTime;
                });

                area.appendChild(el);
            });
        }

        function makeDraggable(element, item) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            function onStart(e) {
                isDragging = true;
                element.classList.add('dragging');

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialX = item.x;
                initialY = item.y;

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
            }

            function onMove(e) {
                if (!isDragging) return;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                let newX = initialX + dx;
                let newY = initialY + dy;

                newX = Math.max(5, Math.min(window.innerWidth - 85, newX));
                newY = Math.max(5, Math.min(window.innerHeight - 110, newY));

                item.x = newX;
                item.y = newY;

                element.style.left = `${newX}px`;
                element.style.top = `${newY}px`;
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                element.classList.remove('dragging');

                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onEnd);

                saveState();
            }

            element.addEventListener('mousedown', onStart);
            element.addEventListener('touchstart', onStart, { passive: true });
        }

        // MULTITASKING WINDOWS SYSTEM

                    <div class="flex items-center gap-1.5">
                        <button onclick="execCmd('${item.id}', 'bold')" class="y2k-btn-pill px-2.5 py-1"><b>B</b></button>

        function bringToFront(id) {
            if (!openWindows[id]) return;
            topZIndex++;
            openWindows[id].zIndex = topZIndex;
            openWindows[id].element.style.zIndex = topZIndex;
        }

        function minimizeWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].minimized = true;
            openWindows[id].element.classList.add('minimized');
            renderDockApps();
        }

        function restoreWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].minimized = false;
            openWindows[id].element.classList.remove('minimized');
            bringToFront(id);
            renderDockApps();
        }

        function closeWindow(id) {
            if (!openWindows[id]) return;
            openWindows[id].element.remove();
            delete openWindows[id];
            renderDockApps();
        }

        function toggleHeartLike(id) {
            const btn = document.getElementById(`heart-btn-${id}`);
            if (!btn || !openWindows[id]) return;
            openWindows[id].isLiked = !openWindows[id].isLiked;
            btn.classList.toggle('!text-rose-500', openWindows[id].isLiked);
            btn.classList.toggle('!border-rose-300', openWindows[id].isLiked);
        }

        // DOCK MULTITASKING APPS CONTAINER
        function renderDockApps() {
            const container = document.getElementById('dock-apps-list');
            if (!container) return;
            container.innerHTML = '';

            Object.keys(openWindows).forEach((id) => {
                const item = desktopItems.find(i => i.id === id);
                if (!item) return;

                const winData = openWindows[id];
                const btn = document.createElement('button');
                btn.className = 'dock-btn p-2.5 rounded-2xl flex items-center justify-center';
                btn.onclick = () => {
                    if (winData.minimized) {
                        restoreWindow(id);
                    } else {
                        bringToFront(id);
                    }
                };

                let iconHtml = item.icon.startsWith('http') || item.icon.startsWith('data:image')
                    ? `<img src="${item.icon}" class="w-5 h-5 object-contain">`
                    : `<span class="text-base leading-none">${item.icon}</span>`;

                btn.innerHTML = `
                    ${iconHtml}
                    <span class="tooltip px-3 py-1 text-[11px] font-semibold">${item.title}</span>
                    <span class="dock-dot"></span>
                `;

                container.appendChild(btn);
            });
        }

        // NOTE EDITING & IMAGES ATTACHMENT
        function execCmd(id, command, value = null) {
            const editor = document.getElementById(`editor-${id}`);
            if (editor) {
                editor.focus();
                document.execCommand(command, false, value);
                saveNoteContent(id);
            }
        }

        function saveNoteContent(id) {
            const item = desktopItems.find(i => i.id === id);
            const editor = document.getElementById(`editor-${id}`);
            if (item && editor) {
                item.content = editor.innerHTML;
                saveState();
            }
        }

        function updateWindowTitle(id, newTitle) {
            const item = desktopItems.find(i => i.id === id);
            if (item) {
                item.title = newTitle || 'Sin título';
                saveState();
                renderDesktop();
                renderDockApps();
            }
        }

        function renderNoteImages(id) {
            const item = desktopItems.find(i => i.id === id);
            if (!item) return;

            const grid = document.getElementById(`img-grid-${id}`);
            const countLabel = document.getElementById(`img-count-${id}`);
            if (!grid || !countLabel) return;

            grid.innerHTML = '';
            const images = item.images || [];
            countLabel.textContent = `${images.length} ${images.length === 1 ? 'imagen' : 'imágenes'}`;

            if (images.length === 0) {
                grid.innerHTML = `<p class="text-[11px] text-pink-300 col-span-full py-1">No hay imágenes adjuntas aún.</p>`;
                return;
            }

            images.forEach((imgUrl, idx) => {
                const imgCard = document.createElement('div');
                imgCard.className = 'relative group rounded-xl overflow-hidden bg-white border border-pink-100 h-24 shadow-xs';
                imgCard.innerHTML = `
                    <img src="${imgUrl}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-1.5">
                        <button onclick="removeImageFromNote('${id}', ${idx})" class="p-1.5 bg-rose-500 rounded-lg text-white" title="Eliminar imagen">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(imgCard);
            });
            lucide.createIcons();
        }

        function handleImageUploadToNote(id, event) {
            const item = desktopItems.find(i => i.id === id);
            if (!item) return;

            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    if (!item.images) item.images = [];
                    item.images.push(e.target.result);
                    saveState();
                    renderNoteImages(id);
                };
                reader.readAsDataURL(file);
            }
        }

        function removeImageFromNote(id, index) {
            const item = desktopItems.find(i => i.id === id);
            if (!item || !item.images) return;
            item.images.splice(index, 1);
            saveState();
            renderNoteImages(id);
        }

        function deleteItem(id) {
            desktopItems = desktopItems.filter(i => i.id !== id);
            saveState();
            renderDesktop();
            closeWindow(id);
        }

        function setupWindowDragging(win, id) {
            const header = document.getElementById(`win-header-${id}`);
            let isDragging = false;
            let offsetX, offsetY;

            header.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                isDragging = true;
                bringToFront(id);
                offsetX = e.clientX - win.offsetLeft;
                offsetY = e.clientY - win.offsetTop;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                win.style.left = `${e.clientX - offsetX}px`;
                win.style.top = `${e.clientY - offsetY}px`;
            });

            document.addEventListener('mouseup', () => { isDragging = false; });
        }

        // CREATE NEW ITEM MODAL
        function openNewModal() {
            document.getElementById('new-item-modal').classList.remove('hidden');
        }

        function closeNewModal() {
            document.getElementById('new-item-modal').classList.add('hidden');
        }

        function handleCreateItem(event) {
            event.preventDefault();
            const title = document.getElementById('item-title').value;
            const icon = document.getElementById('item-icon').value || '🌸';
            const noteBody = document.getElementById('item-note-body').value;

            const pos = getRandomPosition(desktopItems.length);

            const newItem = {
                id: Date.now().toString(),
                title,
                icon,
                content: noteBody || '',
                images: [],
                x: pos.x,
                y: pos.y
            };

            desktopItems.push(newItem);
            saveState();
            renderDesktop();
            closeNewModal();
            document.getElementById('new-item-form').reset();
            openWindow(newItem);
        }

        function resetDesktop() {
            desktopItems = JSON.parse(JSON.stringify(defaultItems));
            currentWallpaper = defaultWallpaper;
            resetThemePalette();
            setWallpaper(defaultWallpaper);
            shuffleItems();
        }
    </script>
</body>
</html>
